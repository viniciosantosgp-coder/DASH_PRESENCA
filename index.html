empo médio de atuação, por analista.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"flex items-center gap-2\">\n                        <button onclick=\"voltarParaFila()\" class=\"px-4 py-2 text-sm font-semibold text-stone-500 hover:text-stone-800 transition-colors\">← Voltar à fila<\u002Fbutton>\n                        <button onclick=\"carregarDashboardAtuacao()\" class=\"inline-flex items-center gap-2 px-4 py-2 bg-stone-100 hover:bg-stone-200 rounded-lg text-sm font-semibold text-stone-700 transition-colors\">\n                            <svg width=\"14\" height=\"14\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M197.67,186.37a8,8,0,0,1,0,11.29C196.58,198.75,178.91,216,144,216c-37.4,0-64.53-21.24-80-40.06V193a8,8,0,0,1-16,0V152a8,8,0,0,1,8-8h41a8,8,0,0,1,0,16H80.37c14,17.66,35.85,32,63.63,32,25.9,0,39.14-13.66,42.6-16.9A8,8,0,0,1,197.67,186.37ZM40,80c3.46-3.24,16.7-16.9,42.6-16.9,27.78,0,49.66,14.34,63.63,32H130a8,8,0,0,0,0,16h41a8,8,0,0,0,8-8V63a8,8,0,0,0-16,0v17.06C147.53,61.24,120.4,40,83,40,48.09,40,30.42,57.25,29.33,58.34a8,8,0,0,0,11.34,11.3Z\"><\u002Fpath><\u002Fsvg>\n                            Atualizar\n                        <\u002Fbutton>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div id=\"corpoDashboardAtuacao\" class=\"text-sm text-stone-400\">Clique em \"Atualizar\" para carregar os dados.<\u002Fdiv>\n            <\u002Fdiv>\n            <!-- /viewDashboardAtuacao -->\n\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fmain>\n\n\n\n        <!-- ===== MODAL: CANCELAMENTO ===== -->\n        <div id=\"modalCancelamento\" class=\"hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6\">\n            <div class=\"bg-white rounded-2xl shadow-xl max-w-md w-full p-6\">\n                <h3 class=\"text-red-600 font-bold text-lg mb-1\">Cancelar proposta<\u002Fh3>\n                <p class=\"text-sm text-stone-600 mb-4\">Você tem certeza que deseja cancelar a proposta <strong id=\"cancelPropostaId\"><\u002Fstrong>? Essa ação não poderá ser desfeita!<\u002Fp>\n\n                <label class=\"text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1\">Motivo de cancelamento<\u002Flabel>\n                <select id=\"selectMotivoCancelamento\" class=\"w-full border border-stone-200 rounded-lg px-3 py-2.5 text-sm mb-4\">\n                    <option value=\"\">Carregando motivos...<\u002Foption>\n                <\u002Fselect>\n\n                <label class=\"text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1\">Descrição<\u002Flabel>\n                <textarea id=\"descricaoCancelamento\" rows=\"3\" placeholder=\"Detalhe o motivo do cancelamento...\" class=\"w-full border border-stone-200 rounded-lg px-3 py-2.5 text-sm mb-4\"><\u002Ftextarea>\n\n                <div id=\"outCancelamento\" class=\"mb-3\"><\u002Fdiv>\n\n                <div class=\"flex justify-end gap-3\">\n                    <button onclick=\"fecharModalCancelamento()\" class=\"px-4 py-2 text-sm font-semibold text-stone-500 hover:text-stone-700\">Voltar<\u002Fbutton>\n                    <button id=\"btnConfirmarCancelamento\" onclick=\"confirmarCancelamento()\" class=\"px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold transition-colors\">Confirmar cancelamento<\u002Fbutton>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== MODAL: PROPOSTA EM ANÁLISE ===== -->\n        <div id=\"modalEmAnalise\" class=\"hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6\">\n            <div class=\"bg-white rounded-2xl shadow-xl max-w-md w-full p-6\">\n                <h3 class=\"text-purple-700 font-bold text-lg mb-1\">Proposta em análise<\u002Fh3>\n                <p class=\"text-sm text-stone-600 mb-4\">A proposta <strong id=\"emAnalisePropostaId\"><\u002Fstrong> já está sendo analisada por outro colaborador.<\u002Fp>\n\n                <div class=\"border border-purple-200 bg-purple-50 rounded-xl p-4 mb-4\">\n                    <div class=\"flex items-center gap-3\">\n                        <span id=\"emAnaliseIniciais\" class=\"w-10 h-10 rounded-full bg-purple-100 text-purple-700 text-sm font-bold flex items-center justify-center shrink-0\"><\u002Fspan>\n                        <div class=\"min-w-0 flex-1\">\n                            <p id=\"emAnaliseNome\" class=\"text-sm font-bold text-stone-800 truncate\"><\u002Fp>\n                            <p id=\"emAnaliseTempo\" class=\"text-xs text-stone-500 mt-0.5\"><\u002Fp>\n                        <\u002Fdiv>\n                        <span id=\"emAnaliseFila\" class=\"text-xs font-semibold px-2 py-0.5 rounded-full bg-white text-[#E35205] border border-orange-200 shrink-0\"><\u002Fspan>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <p class=\"text-xs text-stone-400 mb-4 leading-snug\">Você poderá acessá-la quando o colaborador passar para outra proposta ou liberar a marcação.<\u002Fp>\n\n                <div class=\"flex justify-end\">\n                    <button onclick=\"fecharModalEmAnalise()\" class=\"px-4 py-2 bg-stone-800 hover:bg-stone-700 text-white rounded-lg text-sm font-semibold transition-colors\">Entendi<\u002Fbutton>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== MODAL: PENDENCIAR PROPOSTA ===== -->\n        <div id=\"modalPendencia\" class=\"hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6\">\n            <div class=\"bg-white rounded-2xl shadow-xl max-w-md w-full p-6\">\n                <h3 class=\"text-amber-500 font-bold text-lg mb-1\">Pendenciar proposta<\u002Fh3>\n                <p class=\"text-sm text-stone-600 mb-4\">Descreva a observação da pendência da proposta <strong id=\"pendenciaPropostaId\"><\u002Fstrong>.<\u002Fp>\n\n                <label class=\"text-xs font-bold text-stone-400 uppercase tracking-wider block mb-1\">Observação<\u002Flabel>\n                <textarea id=\"observacaoPendencia\" rows=\"4\" placeholder=\"Detalhe o que está pendente...\" class=\"w-full border border-amber-300 rounded-lg px-3 py-2.5 text-sm mb-4 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 outline-none\"><\u002Ftextarea>\n\n                <div id=\"outPendencia\" class=\"mb-3\"><\u002Fdiv>\n\n                <div class=\"flex justify-end gap-3\">\n                    <button onclick=\"fecharModalPendencia()\" class=\"px-4 py-2 text-sm font-semibold text-stone-500 hover:text-stone-700\">Voltar<\u002Fbutton>\n                    <button id=\"btnConfirmarPendencia\" onclick=\"confirmarPendencia()\" class=\"px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm font-semibold transition-colors\">Confirmar pendência<\u002Fbutton>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== MODAL: CHECKLIST DA OPERAÇÃO ===== -->\n        <div id=\"modalChecklist\" class=\"hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6\">\n            <div class=\"bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[85vh] flex flex-col\">\n                <div class=\"px-6 py-5 border-b border-stone-100 flex items-center justify-between\">\n                    <h3 class=\"text-xl font-bold text-stone-800 flex items-center gap-2\">\n                        <svg width=\"20\" height=\"20\" fill=\"#E35205\" viewBox=\"0 0 256 256\"><path d=\"M200,32H163.74a32,32,0,0,0-59.48,0H56A16,16,0,0,0,40,48V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm-72,0a16,16,0,0,1,16,16H112A16,16,0,0,1,128,32Zm72,184H56V48H92.42A32.2,32.2,0,0,0,92,56v8a8,8,0,0,0,8,8h56a8,8,0,0,0,8-8V56a32.2,32.2,0,0,0-.42-8H200Z\"><\u002Fpath><\u002Fsvg>\n                        Checklist da Operação\n                    <\u002Fh3>\n                    <button onclick=\"fecharModalChecklist()\" class=\"text-stone-400 hover:text-stone-700 text-2xl leading-none\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div id=\"corpoModalChecklist\" class=\"px-6 py-4 overflow-y-auto flex-1\"><\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"modalEtapas\" class=\"hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6\">\n            <div class=\"bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[85vh] flex flex-col\">\n                <div class=\"px-6 py-5 border-b border-stone-100 flex items-center justify-between\">\n                    <h3 class=\"text-xl font-bold text-stone-800\">Etapas da Proposta<\u002Fh3>\n                    <button onclick=\"fecharModalEtapas()\" class=\"text-stone-400 hover:text-stone-700 text-2xl leading-none\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div id=\"corpoModalEtapas\" class=\"px-6 py-4 overflow-y-auto flex-1\"><\u002Fdiv>\n                <div class=\"px-6 py-4 border-t border-stone-100 text-right\">\n                    <button onclick=\"fecharModalEtapas()\" class=\"text-sm font-bold text-[#E35205] hover:text-[#c44503]\">Fechar<\u002Fbutton>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <script>\n        // =====================================================================\n        // CONFIG: filas e modalidades correspondentes (extraídas do payload real)\n        // =====================================================================\n        const FILAS = {\n            fgts: { nome: 'FGTS', modalidades: ['FGTS'] },\n            consignado: { nome: 'Consignado Privado', modalidades: ['Consignado Privado'] },\n            inss: { nome: 'INSS', modalidades: ['INSS'] },\n            siape: { nome: 'SIAPE', modalidades: ['SIAPE'] },\n            convenios: {\n                nome: 'Convênios',\n                modalidades: [\n                    \"GOV SP - SPPREV\",\"GOV SP - SEFAZ\",\"GOV SP - MPESP\",\"Pref de SBC\",\"Embu das Artes\",\"HSPM\",\"IPRESB\",\"Gov Minas\",\"Gov MT\",\"Gov SP\",\"Gov GO\",\"Pref Ananindeua\",\"Pref Barueri\",\"Pref Cotia\",\"Pref Goiania\",\"Praia Grande\",\"Pref Sorocaba\",\"Pref SP\",\"Duque de Caxias\",\"Pref RJ\",\"Gov AL\",\"Gov CE\",\"Gov MA\",\"Gov PI\",\"Gov TO\",\"IGEPREV\",\"IPAM\",\"IPMO\",\"IPREM\",\"TRT 15 CAMPINAS\",\"Pref Aquiraz\",\"Pref Aracruz\",\"Belo Horizonte\",\"Pref Cachoeirinha\",\"Pref Cabedelo\",\"Pref Cajamar\",\"Pref Campina Grande\",\"Pref Campinas\",\"Pref Caucaia\",\"Pref Joao Pessoa\",\"Juazeiro do Norte\",\"Pref Maceio\",\"Pref Maua\",\"Pref Navegantes\",\"Pref Nova Lima\",\"Pref Palmas\",\"Pref Sobral\",\"PREVIJUNO\",\"Gov Parana\",\"Pref Curitiba\",\"Pref Maringa\",\"Pref Porto Alegre\",\"Pref Ponta Grossa\",\"Pref Foz do Iguacu\",\"Pref Medianeira\",\"Pref Arapongas\",\"Pref Pirai do Sul\",\"Pref Planaltina\",\"Pref Recife\",\"Gov Amazonas\",\"Gov Santa Catarina\",\"Gov Paraiba\",\"Pref Uberlandia\",\"Pref Ribeirao Preto\",\"Pref Campo Largo\",\"Pref Ipatinga\",\"Pref Sao Goncalo\",\"Pref Serra\",\"Pref Sorriso\",\"Pref Varzea Grande\",\"Pref Florianopolis\",\"Pref Porto Velho\",\"Pref Santo Andre\",\"Pref Caldas Novas\",\"Pref Itanhaem\",\"Pref Piracicaba\",\"Pref Governador Valadares\",\"Pref Porto Nacional\",\"Pref Londrina\",\"Pref Natal\",\"Pref Cariacica\",\"Gov Rio de Janeiro\",\"Gov Amapá\",\"Gov RN\",\"Compra de Dívida - Governo de Goiás\",\"Compra de Dívida - Governo do Maranhão\",\"Compra de Dívida - Prefeitura de Belo Horizonte\",\"Compra de Dívida - Prefeitura de Mariana\",\"Compra de Dívida - Governo do Acre\",\"Compra de Dívida - Prefeitura de Blumenau\",\"Pref Bauru\",\"Pref Araraquara\",\"Pref Juiz de Fora\",\"Pref São Luiz\",\"Pref Niterói\",\"Pref Aguas Lindas\",\"Gov Acre\",\"Pref Blumenau\",\"Pref Brasilandia MS\",\"Pref Mariana\",\"Pref Sao Jose dos Campos SP\",\"Pref Guarulhos\"\n                ]\n            }\n        };\n\n        const ICONES = {\n            fgts: '<path d=\"M240,104a16,16,0,0,1-16,16h-8v40a16,16,0,0,1-16,16H176a16,16,0,0,1-16-16V160H96v40a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V152.72c-9.62-6.85-16-18.31-16-31.72a40,40,0,0,1,40-40h.53A79.53,79.53,0,0,1,128,48a79.9,79.9,0,0,1,68.34,38.68C218.31,88.53,236,102.09,240,104ZM176,88a12,12,0,1,0,12,12A12,12,0,0,0,176,88Z\"><\u002Fpath>',\n            consignado: '<path d=\"M232,224H208V96a8,8,0,0,0-8-8H160V40a8,8,0,0,0-8-8H56a8,8,0,0,0-8,8V224H24a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16ZM64,48h80V224H64Zm128,176H160V104h32Z\"><\u002Fpath>',\n            inss: '<path d=\"M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.84,8c18.84-32.56,52.14-52,89.08-52s70.24,19.44,89.08,52a8,8,0,1,0,13.84-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z\"><\u002Fpath>',\n            siape: '<path d=\"M128,24,32,72v16H224V72Zm88,80H40v88H24v16H232V192H216ZM72,192H56V120H72Zm40,0H96V120h16Zm40,0H136V120h16Zm40,0H176V120h16Z\"><\u002Fpath>',\n            convenios: '<path d=\"M188.6,116.09,133.65,71a8,8,0,0,0-10.24,0L68.51,116h0l-.13.11a48,48,0,0,0,60.29,74.83,48,48,0,0,0,60.06-74.71ZM128,53.4l45.79,37.87-.2.17L128.9,127a7.87,7.87,0,0,1-10.2,0l-44.5-35.55-.2-.17ZM128,178.14a32,32,0,0,1-23.9-53.24l19.2-15.75a24,24,0,0,0,9.4,0l19.2,15.75A32,32,0,0,1,128,178.14Z\"><\u002Fpath>'\n        };\n\n        function svgIcon(key, cls = 'w-5 h-5') {\n            return `<svg class=\"${cls}\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"currentColor\" viewBox=\"0 0 256 256\">${ICONES[key] || ''}<\u002Fsvg>`;\n        }\n\n        const TODOS_TIPOS_CREDITO = [\"Novo\", \"Refinanciamento\", \"Portabilidade\", \"Cartão RMC\", \"Cartão benefício\", \"Aumento\", \"Compra\"];\n\n        // Mapa statusId -> nome da etapa (baseado nos status já observados no sistema)\n        const STATUS_MAP = {\n            1: 'Criada',\n            3: 'Aguardando assinaturas',\n            4: 'Análise mesa',\n            7: 'Cancelada',\n            8: 'Paga',\n            10: 'Aguardando Link Formalização',\n            11: 'Aguardando geração da Ccb',\n            12: 'Aguardando assinatura da Ccb',\n            13: 'Aguardando averbação',\n            16: 'Análise crivo automático',\n            29: 'Aguardando geração do pagamento automático',\n            30: 'Aguardando confirmação da autorização'\n        };\n        function nomeStatus(id) { return STATUS_MAP[id] || `Status #${id}`; }\n        const TODAS_PENDENCIAS = [\"PEND. ATUAÇÃO PARCEIRO\", \"REANALISE MESA\", \"PENDÊNCIA RESOLVIDA\", \"Sem pêndencia\"];\n\n        // ---------- Estado ----------\n        const state = {\n            token: null,\n            usuario: null,\n            filaAtiva: 'fgts',\n            pendenciasSelecionadas: new Set([\"REANALISE MESA\", \"PENDÊNCIA RESOLVIDA\", \"Sem pêndencia\"]), // PEND. ATUAÇÃO PARCEIRO fica de fora por padrão\n            tipoCreditoPorFila: {},\n            paginaPorFila: {},\n            pageCountPorFila: {},\n            contagemPorFila: {},\n            ultimoResultado: null,\n            emAnalise: {}, // operacaoId -> { usuarioNome, fila, dataInicio }\n            modoBusca: null // null = fila normal | 'todasFilas' | 'buscaId'\n        };\n        Object.keys(FILAS).forEach(k => { state.tipoCreditoPorFila[k] = new Set(TODOS_TIPOS_CREDITO); state.paginaPorFila[k] = 1; state.pageCountPorFila[k] = null; state.contagemPorFila[k] = null; });\n\n        // URL fixa do Apps Script (planilha compartilhada \"Em Análise\") — não exposta na interface\n        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkMTACPSrxNMe3DAP83M0QW2DoalO4nj-TvXZ8sVKZmiHnwva-mx6l3IE26eOEEWUn3g/exec';\n        function appsScriptUrl() { return APPS_SCRIPT_URL; }\n\n        // URL fixa da página de detalhe da proposta — não exposta na interface\n        const BASE_URL_DETALHE = 'https://portal.soupresenca.com.br/propostas/propostas-card-list/detalhe/{id}/cliente';\n\n        // Somente este usuário pode editar os filtros de data, pendências e tipo de crédito\n        const USUARIOS_AUTORIZADOS_FILTROS = [\n            'Victor Freitas Ledo Silva - Suporte tech',\n            'arleidedias',\n            'vinicio.santos'\n        ];\n        function podeEditarFiltros() {\n            const nome = (state.usuario?.nome || '').trim().toLowerCase();\n            const login = (state.usuario?.login || '').trim().toLowerCase();\n            return USUARIOS_AUTORIZADOS_FILTROS.some(u => {\n                const alvo = u.trim().toLowerCase();\n                return alvo === nome || alvo === login;\n            });\n        }\n\n        // Lê a planilha \"EmAnalise\" (GET simples, sem preflight de CORS)\n        async function carregarEmAnalise() {\n            const url = appsScriptUrl();\n            if (!url) return;\n            try {\n                const res = await fetch(url, { method: 'GET' });\n                const json = await res.json();\n                if (json.ok) {\n                    const mapa = {};\n                    json.data.forEach(item => { mapa[item.operacaoId] = item; });\n                    state.emAnalise = mapa;\n                }\n            } catch (e) {\n                console.warn('Falha ao carregar planilha de Em Análise:', e.message);\n            }\n        }\n\n        // Marca uma proposta como \"em análise por mim\" (POST como text/plain para evitar preflight que o Apps Script não trata)\n        // Resolve o nome de exibição da fila com segurança, mesmo nos modos de busca especiais\n        function nomeFilaParaMarcacao(filaKey, p) {\n            return FILAS[filaKey]?.nome || p?.produto?.name || 'Desconhecida';\n        }\n\n        async function marcarEmAnalise(operacaoId, filaKey, nomeFilaOverride) {\n            const url = appsScriptUrl();\n            if (!url) return;\n            const payload = {\n                operacaoId: String(operacaoId),\n                usuarioNome: state.usuario?.nome || 'Desconhecido',\n                fila: nomeFilaOverride || FILAS[filaKey]?.nome || 'Desconhecida',\n                dataInicio: new Date().toISOString()\n            };\n            try {\n                await fetch(url, {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n                    body: JSON.stringify(payload)\n                });\n                state.emAnalise[String(operacaoId)] = payload;\n            } catch (e) {\n                console.warn('Falha ao marcar em análise:', e.message);\n            }\n        }\n\n        // Remove a marcação do usuário atual sem colocar uma nova em seu lugar\n        // (usado quando ele conclui uma proposta e não há próxima disponível na fila)\n        // Registra uma atuação concluída (compliance / pendência / cancelamento) na aba \"Atuacoes\" da planilha.\n        // Usa a hora de marcação (emAnalise) como \"hora que entrou\", se existir.\n        async function registrarAtuacao(operacaoId, tipoAcao) {\n            const url = appsScriptUrl();\n            if (!url) return;\n            const marcado = state.emAnalise[String(operacaoId)];\n            const payload = {\n                acao: 'registrarAtuacao',\n                usuarioNome: state.usuario?.nome || 'Desconhecido',\n                operacaoId: String(operacaoId),\n                tipoAcao,\n                horaEntrada: marcado?.dataInicio || '',\n                horaConclusao: new Date().toISOString()\n            };\n            try {\n                await fetch(url, {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n                    body: JSON.stringify(payload)\n                });\n            } catch (e) {\n                console.warn('Falha ao registrar atuação:', e.message);\n            }\n        }\n\n        async function liberarMinhaMarcacao() {\n            const url = appsScriptUrl();\n            const meuNome = state.usuario?.nome;\n            if (!url || !meuNome) return;\n            try {\n                await fetch(url, {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n                    body: JSON.stringify({ usuarioNome: meuNome, acao: 'liberar' })\n                });\n                Object.keys(state.emAnalise).forEach(id => {\n                    if (state.emAnalise[id].usuarioNome === meuNome) delete state.emAnalise[id];\n                });\n            } catch (e) {\n                console.warn('Falha ao liberar marcação:', e.message);\n            }\n        }\n\n        // Remove a marcação de QUALQUER colaborador numa proposta específica.\n        // Restrito ao usuário autorizado (mesma regra dos filtros de data/pendências/tipo de crédito).\n        async function removerMarcacaoAdmin(operacaoId) {\n            if (!podeEditarFiltros()) return;\n            const url = appsScriptUrl();\n            if (!url) return;\n            if (!confirm('Remover a marcação de \"em análise\" dessa proposta?')) return;\n            try {\n                await fetch(url, {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n                    body: JSON.stringify({ acao: 'liberarPorOperacao', operacaoId: String(operacaoId) })\n                });\n                delete state.emAnalise[String(operacaoId)];\n                if (state.ultimoResultado) renderLista(state.ultimoResultado, state.filaAtiva, state.paginaPorFila[state.filaAtiva]);\n            } catch (e) {\n                console.warn('Falha ao remover marcação:', e.message);\n            }\n        }\n\n        function minutosDesde(iso) {\n            return Math.round((Date.now() - new Date(iso).getTime()) / 60000);\n        }\n\n        // URL fixa da API — não exposta na interface\n        const API_BASE_URL = 'https://presenca-bank-api.azurewebsites.net';\n        function baseUrl() { return API_BASE_URL; }\n\n        function alternarModoNoturno() {\n            const escuro = document.documentElement.classList.toggle('dark');\n            localStorage.setItem('mesa_modo_noturno', escuro ? '1' : '0');\n            document.getElementById('iconeSol').classList.toggle('hidden', escuro);\n            document.getElementById('iconeLua').classList.toggle('hidden', !escuro);\n        }\n\n        // Aplica a preferência salva assim que o script carrega (antes do login, evitando \"flash\" de tela clara)\n        (function aplicarModoNoturnoSalvo() {\n            const escuro = localStorage.getItem('mesa_modo_noturno') === '1';\n            if (escuro) document.documentElement.classList.add('dark');\n            document.getElementById('iconeSol')?.classList.toggle('hidden', escuro);\n            document.getElementById('iconeLua')?.classList.toggle('hidden', !escuro);\n        })();\n\n        function todayLocal() {\n            const d = new Date();\n            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\n        }\n\n        function parseJwt(token) {\n            try {\n                const payload = token.split('.')[1];\n                return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));\n            } catch { return null; }\n        }\n\n        // Chama a API real diretamente pelo navegador.\n        async function api(method, path, body) {\n            const url = `${baseUrl()}${path}`;\n            const headers = { 'Content-Type': 'application/json' };\n            if (state.token) headers['Authorization'] = `Bearer ${state.token}`;\n\n            let res, data;\n            try {\n                res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });\n            } catch (e) {\n                document.getElementById('corsWarning')?.classList.remove('hidden');\n                throw new Error('NETWORK_OR_CORS');\n            }\n            try { data = await res.json(); } catch { data = null; }\n            return { ok: res.ok, status: res.status, data };\n        }\n\n        // ===================== LOGIN + CACHE DIÁRIO =====================\n        function tentarAutoLogin() {\n            const cached = localStorage.getItem('presenca_mesa_auth');\n            if (!cached) return false;\n            try {\n                const obj = JSON.parse(cached);\n                if (obj.dataLogin !== todayLocal()) return false;\n                const payload = parseJwt(obj.token);\n                if (!payload || payload.exp * 1000 < Date.now()) return false;\n                state.token = obj.token;\n                state.usuario = obj.usuario;\n                return true;\n            } catch { return false; }\n        }\n\n        async function doLogin() {\n            const login = document.getElementById('loginInput').value.trim();\n            const senha = document.getElementById('senhaInput').value;\n            if (!login || !senha) { showLoginErr('Preencha login e senha.'); return; }\n\n            document.getElementById('outLogin').innerHTML = '';\n            const { ok, status, data } = await api('POST', '/login', { login, senha });\n\n            if (!ok) {\n                showLoginErr(`Falha no login (HTTP ${status}): ${data?.message || 'verifique as credenciais'}`);\n                return;\n            }\n\n            state.token = data.token;\n            state.usuario = data.usuario;\n            localStorage.setItem('presenca_mesa_auth', JSON.stringify({\n                token: data.token, usuario: data.usuario, dataLogin: todayLocal()\n            }));\n            entrarNoApp();\n        }\n\n        function showLoginErr(msg) {\n            document.getElementById('outLogin').innerHTML = `<div class=\"bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700 mt-2\">${msg}<\u002Fdiv>`;\n        }\n\n        function doLogout() {\n            localStorage.removeItem('presenca_mesa_auth');\n            state.token = null; state.usuario = null;\n            document.getElementById('app').classList.add('hidden');\n            document.getElementById('loginGate').classList.remove('hidden');\n        }\n\n        function entrarNoApp() {\n            document.getElementById('loginGate').classList.add('hidden');\n            document.getElementById('app').classList.remove('hidden');\n            document.getElementById('usuarioLogado').textContent = state.usuario?.nome || '';\n            initFiltros();\n            renderProdutoNav();\n            carregarEmAnalise().then(() => buscarPropostas(false));\n            carregarContagensFilas();\n\n            // Atualização automática periódica: planilha de \"em análise\" + lista de propostas + contagem por fila.\n            // \"silencioso=true\" evita mostrar o spinner de carregamento, para não interromper quem está lendo.\n            setInterval(async () => {\n                await carregarEmAnalise();\n                await buscarPropostas(true);\n                carregarContagensFilas();\n            }, 30000);\n        }\n\n        // ===================== FILTROS =====================\n        function diasAtrasLocal(dias) {\n            const d = new Date();\n            d.setDate(d.getDate() - dias);\n            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\n        }\n\n        function initFiltros() {\n            const hoje = todayLocal();\n            document.getElementById('dataInicio').value = diasAtrasLocal(8);\n            document.getElementById('dataFim').value = hoje;\n\n            const autorizado = podeEditarFiltros();\n\n            const sidebarColab = document.getElementById('sidebarColaboradores');\n            sidebarColab.classList.toggle('hidden', !autorizado);\n            sidebarColab.classList.toggle('flex', autorizado);\n            if (autorizado) carregarColaboradoresPorFila();\n\n            const navDash = document.getElementById('navDashboardAtuacao');\n            navDash.classList.toggle('hidden', !autorizado);\n            navDash.classList.toggle('flex', autorizado);\n            document.getElementById('blocoFiltrosRestritos').classList.toggle('hidden', !autorizado);\n\n            document.getElementById('dataInicio').disabled = !autorizado;\n            document.getElementById('dataFim').disabled = !autorizado;\n\n            const avisoExistente = document.getElementById('avisoFiltroBloqueado');\n            if (avisoExistente) avisoExistente.remove();\n\n            const pBox = document.getElementById('pendenciasBox');\n            pBox.innerHTML = TODAS_PENDENCIAS.map(p => `\n                <label class=\"flex items-start gap-2 py-1.5 text-sm ${autorizado ? 'cursor-pointer' : 'cursor-not-allowed opacity-60'}\">\n                    <input type=\"checkbox\" class=\"mt-0.5 chk-pendencia\" value=\"${p}\" ${state.pendenciasSelecionadas.has(p) ? 'checked' : ''} ${autorizado ? '' : 'disabled'}>\n                    <span class=\"${p === 'PEND. ATUAÇÃO PARCEIRO' ? 'text-stone-400' : 'text-stone-700'}\">${p}${p === 'PEND. ATUAÇÃO PARCEIRO' ? \" <span class='block text-[10px] text-stone-400'>(fora da mesa por padrão)<\u002Fspan>\" : ''}<\u002Fspan>\n                <\u002Flabel>\n            `).join('');\n            pBox.querySelectorAll('.chk-pendencia').forEach(chk => {\n                chk.addEventListener('change', () => {\n                    if (chk.checked) state.pendenciasSelecionadas.add(chk.value);\n                    else state.pendenciasSelecionadas.delete(chk.value);\n                    atualizarContadores();\n                });\n            });\n\n            renderTipoCreditoBox();\n            atualizarContadores();\n\n            const btnAplicar = document.getElementById('btnAplicarFiltros');\n            if (btnAplicar) {\n                btnAplicar.disabled = !autorizado;\n                btnAplicar.classList.toggle('opacity-50', !autorizado);\n                btnAplicar.classList.toggle('cursor-not-allowed', !autorizado);\n            }\n        }\n\n        function renderTipoCreditoBox() {\n            const box = document.getElementById('tipoCreditoBox');\n            const selecionados = state.tipoCreditoPorFila[state.filaAtiva];\n            const autorizado = podeEditarFiltros();\n            box.innerHTML = `<p class=\"text-[10px] font-bold text-stone-400 uppercase mb-2\">Filtro específico da fila ${FILAS[state.filaAtiva].nome}<\u002Fp>` +\n                TODOS_TIPOS_CREDITO.map(t => `\n                    <label class=\"flex items-center gap-2 py-1 text-sm ${autorizado ? 'cursor-pointer' : 'cursor-not-allowed opacity-60'}\">\n                        <input type=\"checkbox\" class=\"chk-tipo\" value=\"${t}\" ${selecionados.has(t) ? 'checked' : ''} ${autorizado ? '' : 'disabled'}>\n                        <span class=\"text-stone-700\">${t}<\u002Fspan>\n                    <\u002Flabel>\n                `).join('');\n            box.querySelectorAll('.chk-tipo').forEach(chk => {\n                chk.addEventListener('change', () => {\n                    if (chk.checked) selecionados.add(chk.value);\n                    else selecionados.delete(chk.value);\n                    atualizarContadores();\n                });\n            });\n        }\n\n        function atualizarContadores() {\n            document.getElementById('countPendencias').textContent = state.pendenciasSelecionadas.size;\n            document.getElementById('countTipoCredito').textContent = state.tipoCreditoPorFila[state.filaAtiva].size;\n        }\n\n        // ===================== NAV DE PRODUTO =====================\n        function renderProdutoNav() {\n            const nav = document.getElementById('produtoNav');\n            nav.innerHTML = '';\n            Object.entries(FILAS).forEach(([key, fila]) => {\n                const btn = document.createElement('button');\n                const ativo = key === state.filaAtiva;\n                const contagem = state.contagemPorFila[key];\n                btn.className = `produto-btn ${ativo ? 'active' : ''} flex items-center gap-2.5 px-4 py-3 bg-white border border-stone-200 rounded-xl text-sm font-semibold text-stone-700 shadow-sm`;\n                btn.innerHTML = `\n                    ${svgIcon(key)} ${fila.nome}\n                    <span class=\"count-badge text-xs font-bold px-2 py-0.5 rounded-full bg-stone-100 text-stone-600 min-w-[1.75rem] text-center\">${contagem == null ? '…' : contagem}<\u002Fspan>\n                `;\n                btn.onclick = () => {\n                    state.filaAtiva = key;\n                    state.modoBusca = null;\n                    renderProdutoNav();\n                    renderTipoCreditoBox();\n                    atualizarContadores();\n                    buscarPropostas();\n                };\n                nav.appendChild(btn);\n            });\n        }\n\n        // Consulta rapidamente (pageSize=1) o total de propostas em cada fila, para exibir no menu lateral\n        async function carregarContagensFilas() {\n            for (const [key, fila] of Object.entries(FILAS)) {\n                const body = {\n                    tipoPeriodo: 'criacao', page: 1, pageSize: 1,\n                    status: ['Análise mesa'], modalidade: fila.modalidades,\n                    tipoCredito: Array.from(state.tipoCreditoPorFila[key]),\n                    startDate: document.getElementById('dataInicio').value,\n                    endDate: document.getElementById('dataFim').value,\n                    pendencias: Array.from(state.pendenciasSelecionadas)\n                };\n                try {\n                    const { ok, data } = await api('POST', '/v2/operacoes/listar', body);\n                    if (ok && data) state.contagemPorFila[key] = data.rowCount ?? 0;\n                } catch { /* mantém valor anterior em caso de falha */ }\n            }\n            renderProdutoNav();\n        }\n\n        // ===================== BUSCA DE PROPOSTAS =====================\n        function dataReferencia(p) {\n            const ultimo = new Date(p.dataUltimoStatus);\n            if (ultimo.getFullYear() > 1900) return ultimo;\n            return new Date(p.dataOperacao);\n        }\n        function horasDesde(date) { return (Date.now() - date.getTime()) / (1000 * 60 * 60); }\n        function formatarEspera(h) {\n            if (h < 1) return `${Math.round(h * 60)} min`;\n            const horas = Math.floor(h);\n            const min = Math.round((h - horas) * 60);\n            return `${horas}h${min > 0 ? ' ' + min + 'min' : ''}`;\n        }\n        function corUrgencia(h) {\n            if (h > 8) return { dot: 'bg-red-500', badge: 'bg-red-50 text-red-700 border-red-200' };\n            if (h > 2) return { dot: 'bg-amber-500', badge: 'bg-amber-50 text-amber-700 border-amber-200' };\n            return { dot: 'bg-green-500', badge: 'bg-green-50 text-green-700 border-green-200' };\n        }\n        function fmtMoney(v) { return v == null ? '—' : 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n\n        // Retorna a \"chave\" usada para cache de página/pageCount, dependendo do modo atual\n        function chaveAtual() {\n            if (state.modoBusca === 'todasFilas') return '__todasFilas__';\n            if (state.modoBusca === 'buscaId') return '__buscaId__';\n            return state.filaAtiva;\n        }\n\n        function montarBody(page) {\n            const dataInicio = document.getElementById('dataInicio').value;\n            const dataFim = document.getElementById('dataFim').value;\n\n            if (state.modoBusca === 'todasFilas') {\n                // Igual ao filtro por fila, mas sem o campo \"modalidade\" — retorna todos os produtos\n                return {\n                    tipoPeriodo: 'criacao', page, pageSize: 40,\n                    status: ['Análise mesa'],\n                    startDate: dataInicio, endDate: dataFim,\n                    pendencias: Array.from(state.pendenciasSelecionadas)\n                };\n            }\n\n            if (state.modoBusca === 'buscaId') {\n                // Busca livre por ID/texto — sem filtros de status/modalidade/pendências\n                return {\n                    tipoPeriodo: 'criacao', page, pageSize: 40,\n                    startDate: dataInicio, endDate: dataFim,\n                    queryText: state.textoBusca || ''\n                };\n            }\n\n            const filaKey = state.filaAtiva;\n            const fila = FILAS[filaKey];\n            return {\n                tipoPeriodo: 'criacao', page, pageSize: 40,\n                status: ['Análise mesa'],\n                modalidade: fila.modalidades,\n                tipoCredito: Array.from(state.tipoCreditoPorFila[filaKey]),\n                startDate: dataInicio, endDate: dataFim,\n                pendencias: Array.from(state.pendenciasSelecionadas)\n            };\n        }\n\n        function buscarTodasAsFilas() {\n            state.modoBusca = 'todasFilas';\n            state.paginaPorFila['__todasFilas__'] = 1;\n            state.pageCountPorFila['__todasFilas__'] = null;\n            buscarPropostas();\n        }\n\n        function buscarPorId() {\n            const texto = document.getElementById('buscaId').value.trim();\n            if (!texto) return;\n            state.modoBusca = 'buscaId';\n            state.textoBusca = texto;\n            state.paginaPorFila['__buscaId__'] = 1;\n            state.pageCountPorFila['__buscaId__'] = null;\n            buscarPropostas();\n        }\n\n        function voltarParaFilaNormal() {\n            state.modoBusca = null;\n            document.getElementById('buscaId').value = '';\n            buscarPropostas();\n        }\n\n        async function buscarPropostas(silencioso) {\n            const chave = chaveAtual();\n            const uiPage = state.paginaPorFila[chave] || 1;\n            state.paginaPorFila[chave] = uiPage;\n\n            if (state.modoBusca === 'todasFilas') {\n                document.getElementById('tituloLista').innerHTML = `Todas as Filas`;\n            } else if (state.modoBusca === 'buscaId') {\n                document.getElementById('tituloLista').innerHTML = `Busca: \"${state.textoBusca}\"`;\n            } else {\n                document.getElementById('tituloLista').innerHTML = `${svgIcon(state.filaAtiva, 'w-4 h-4 inline -mt-0.5 mr-1.5 text-[#E35205]')}${FILAS[state.filaAtiva].nome}`;\n            }\n\n            if (!silencioso) {\n                document.getElementById('listaBody').innerHTML = `<div class=\"flex items-center justify-center gap-2 py-10 text-stone-400 text-sm\"><svg class=\"spin\" width=\"16\" height=\"16\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C215.19,49.64,232,87,232,128Z\"><\u002Fpath><\u002Fsvg>Carregando propostas...<\u002Fdiv>`;\n                document.getElementById('paginacao').innerHTML = '';\n            }\n            document.getElementById('corsWarning').classList.add('hidden');\n\n            try {\n                let pageCount = state.pageCountPorFila[chave];\n                let data, discovery;\n\n                // Se ainda não sabemos o total de páginas para este filtro, descobre com uma busca na página 1 da API\n                if (!pageCount) {\n                    const resp = await api('POST', '/v2/operacoes/listar', montarBody(1));\n                    if (resp.status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n                    if (!resp.ok || !resp.data) {\n                        if (!silencioso) document.getElementById('listaBody').innerHTML = `<div class=\"p-5 text-sm text-red-600\">Falha ao buscar propostas (HTTP ${resp.status}): ${resp.data?.message || 'erro desconhecido'}<\u002Fdiv>`;\n                        return;\n                    }\n                    discovery = resp.data;\n                    pageCount = discovery.pageCount || 1;\n                    state.pageCountPorFila[chave] = pageCount;\n                }\n\n                // No modo fila normal, a \"página 1\" exibida corresponde à ÚLTIMA página real da API (mais antiga).\n                // Nos modos de busca especiais (todas as filas / busca por id), mantemos a ordem normal da API (sem inverter).\n                const inverterPaginas = state.modoBusca === null;\n                const apiPage = inverterPaginas ? Math.max(1, pageCount - (uiPage - 1)) : uiPage;\n\n                if (apiPage === 1 && discovery) {\n                    data = discovery; // já temos os dados da página 1 real, não precisa buscar de novo\n                } else {\n                    const resp2 = await api('POST', '/v2/operacoes/listar', montarBody(apiPage));\n                    if (resp2.status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n                    if (!resp2.ok || !resp2.data) {\n                        if (!silencioso) document.getElementById('listaBody').innerHTML = `<div class=\"p-5 text-sm text-red-600\">Falha ao buscar propostas (HTTP ${resp2.status}): ${resp2.data?.message || 'erro desconhecido'}<\u002Fdiv>`;\n                        return;\n                    }\n                    data = resp2.data;\n                }\n\n                state.ultimoResultado = data;\n                renderLista(data, chave, uiPage);\n            } catch (e) {\n                if (e.message !== 'NETWORK_OR_CORS') {\n                    document.getElementById('listaBody').innerHTML = `<div class=\"p-5 text-sm text-red-600\">Erro inesperado: ${e.message}<\u002Fdiv>`;\n                } else {\n                    document.getElementById('listaBody').innerHTML = '';\n                }\n            }\n        }\n\n        // Guarda contra clique duplo/repetido em qualquer uma das ações abaixo\n        let ultimaAcaoTimestamp = 0;\n        const DEBOUNCE_MS = 1200;\n        function podeExecutarAcao() {\n            const agora = Date.now();\n            if (agora - ultimaAcaoTimestamp < DEBOUNCE_MS) return false;\n            ultimaAcaoTimestamp = agora;\n            return true;\n        }\n\n        function setBotoesProximaDisabled(desabilitado) {\n            const btn = document.getElementById('btnPuxarProposta');\n            if (btn) {\n                btn.disabled = desabilitado;\n                btn.classList.toggle('opacity-50', desabilitado);\n                btn.classList.toggle('cursor-not-allowed', desabilitado);\n            }\n        }\n\n        // Chama PUT /operacoes/{id}/validar-compliance para a proposta clicada\n        async function validarCompliance(id) {\n            const btn = document.getElementById(`btnCompliance-${id}`);\n            if (!btn) return;\n\n            const tooltipOriginal = btn.dataset.tooltip;\n            btn.disabled = true;\n            btn.classList.add('opacity-60', 'cursor-not-allowed');\n            btn.dataset.tooltip = 'Validando...';\n\n            try {\n                const { ok, status, data } = await api('PUT', `/operacoes/${id}/validar-compliance`);\n\n                if (status === 401) {\n                    alert('Sessão expirada. Faça login novamente.');\n                    doLogout();\n                    return;\n                }\n\n                if (ok) {\n                    btn.dataset.tooltip = 'Compliance validado ✓';\n                    btn.classList.remove('border-stone-200');\n                    btn.classList.add('border-green-400', 'bg-green-50');\n\n                    registrarAtuacao(id, 'compliance');\n\n                    // Remove essa proposta da lista local antes de buscar a próxima,\n                    // para evitar que ela mesma seja escolhida de novo caso não estivesse marcada por ninguém.\n                    if (state.ultimoResultado?.result) {\n                        state.ultimoResultado.result = state.ultimoResultado.result.filter(p => String(p.id) !== String(id));\n                    }\n\n                    await concluirEIrParaProxima(); // valida e já encaminha para a próxima proposta livre da fila\n                } else {\n                    btn.dataset.tooltip = 'Erro — clique para tentar de novo';\n                    btn.classList.add('border-red-300');\n                    console.warn('Falha ao validar compliance:', status, data);\n                }\n            } catch (e) {\n                if (e.message !== 'NETWORK_OR_CORS') {\n                    btn.dataset.tooltip = 'Erro — clique para tentar de novo';\n                }\n            } finally {\n                btn.disabled = false;\n                btn.classList.remove('opacity-60', 'cursor-not-allowed');\n                if (btn.dataset.tooltip === 'Validando...') btn.dataset.tooltip = tooltipOriginal;\n            }\n        }\n\n        // ===================== PENDENCIAR PROPOSTA =====================\n        let pendenciaIdAtual = null;\n\n        function abrirModalPendencia(id) {\n            pendenciaIdAtual = id;\n            document.getElementById('pendenciaPropostaId').textContent = `#${id}`;\n            document.getElementById('observacaoPendencia').value = '';\n            document.getElementById('outPendencia').innerHTML = '';\n            document.getElementById('modalPendencia').classList.remove('hidden');\n        }\n\n        function fecharModalPendencia() {\n            document.getElementById('modalPendencia').classList.add('hidden');\n            pendenciaIdAtual = null;\n        }\n\n        async function confirmarPendencia() {\n            const observacao = document.getElementById('observacaoPendencia').value.trim();\n            const out = document.getElementById('outPendencia');\n\n            if (!observacao) { out.innerHTML = `<div class=\"text-sm text-red-600\">Descreva a observação da pendência.<\u002Fdiv>`; return; }\n            if (!pendenciaIdAtual) return;\n\n            const btn = document.getElementById('btnConfirmarPendencia');\n            btn.disabled = true;\n            btn.textContent = 'Enviando...';\n            out.innerHTML = '';\n\n            try {\n                const { ok, status, data } = await api('PATCH', `/operacoes/${pendenciaIdAtual}/pendenciar`, { observacao });\n\n                if (status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n\n                if (ok) {\n                    registrarAtuacao(pendenciaIdAtual, 'pendencia');\n                    fecharModalPendencia();\n\n                    // Remove essa proposta da lista local antes de buscar a próxima,\n                    // para evitar que ela mesma seja escolhida de novo caso não estivesse marcada por ninguém.\n                    if (state.ultimoResultado?.result) {\n                        state.ultimoResultado.result = state.ultimoResultado.result.filter(p => String(p.id) !== String(pendenciaIdAtual));\n                    }\n\n                    await concluirEIrParaProxima(); // a proposta pendenciada some da fila; já busca a próxima\n                } else {\n                    out.innerHTML = `<div class=\"text-sm text-red-600\">Falha ao pendenciar (HTTP ${status}): ${data?.message || 'erro desconhecido'}<\u002Fdiv>`;\n                }\n            } catch (e) {\n                if (e.message !== 'NETWORK_OR_CORS') out.innerHTML = `<div class=\"text-sm text-red-600\">Erro inesperado: ${e.message}<\u002Fdiv>`;\n            } finally {\n                btn.disabled = false;\n                btn.textContent = 'Confirmar pendência';\n            }\n        }\n\n        // ===================== CANCELAMENTO =====================\n        let cancelamentoIdAtual = null;\n\n        // ===================== CHECKLIST DA OPERAÇÃO =====================\n        // Copia o link de formalização do cliente para a área de transferência.\n        // O nome exato do campo na resposta da API ainda não foi confirmado — tenta os candidatos mais prováveis.\n        function copiarLinkFormalizacao(p) {\n            const link = p.formalizacao?.link || p.linkFormalizacao || p.formalizacaoLink || null;\n            const btn = document.getElementById(`btnLinkFormalizacao-${p.id}`);\n\n            if (!link) {\n                if (btn) {\n                    const tooltipOriginal = btn.dataset.tooltip;\n                    btn.dataset.tooltip = 'Link não encontrado nesta proposta';\n                    setTimeout(() => { btn.dataset.tooltip = tooltipOriginal; }, 2500);\n                }\n                return;\n            }\n\n            const textArea = document.createElement('textarea');\n            textArea.value = link;\n            document.body.appendChild(textArea);\n            textArea.select();\n            try { document.execCommand('copy'); } catch (e) { console.warn('Falha ao copiar link:', e.message); }\n            document.body.removeChild(textArea);\n\n            if (btn) {\n                const tooltipOriginal = btn.dataset.tooltip;\n                btn.dataset.tooltip = 'Link copiado ✓';\n                setTimeout(() => { btn.dataset.tooltip = tooltipOriginal; }, 2000);\n            }\n        }\n\n        function corStatusChecklist(status) {\n            const s = (status || '').toLowerCase();\n            if (s === 'aprovado') return { dot: 'bg-green-500', badge: 'bg-green-50 text-green-700' };\n            if (s === 'erro' || s === 'reprovado') return { dot: 'bg-red-500', badge: 'bg-red-50 text-red-700' };\n            if (s === 'pendente') return { dot: 'bg-amber-500', badge: 'bg-amber-50 text-amber-700' };\n            return { dot: 'bg-stone-400', badge: 'bg-stone-100 text-stone-600' };\n        }\n\n        async function abrirModalChecklist(id) {\n            document.getElementById('modalChecklist').classList.remove('hidden');\n            const corpo = document.getElementById('corpoModalChecklist');\n            corpo.innerHTML = `<div class=\"flex items-center justify-center gap-2 py-10 text-stone-400 text-sm\"><svg class=\"spin\" width=\"16\" height=\"16\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C215.19,49.64,232,87,232,128Z\"><\u002Fpath><\u002Fsvg>Carregando checklist...<\u002Fdiv>`;\n\n            try {\n                const { ok, status, data } = await api('GET', `/v5/operacoes/check-list/${id}`);\n                if (status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n                if (!ok || !Array.isArray(data)) {\n                    corpo.innerHTML = `<p class=\"text-sm text-red-600\">Falha ao carregar checklist (HTTP ${status}).<\u002Fp>`;\n                    return;\n                }\n                renderChecklist(data);\n            } catch (e) {\n                if (e.message !== 'NETWORK_OR_CORS') corpo.innerHTML = `<p class=\"text-sm text-red-600\">Erro inesperado: ${e.message}<\u002Fp>`;\n            }\n        }\n\n        function renderChecklist(itens) {\n            const corpo = document.getElementById('corpoModalChecklist');\n\n            if (itens.length === 0) {\n                corpo.innerHTML = `<p class=\"text-sm text-stone-400 text-center py-10\">Nenhum item de checklist encontrado para esta operação.<\u002Fp>`;\n                return;\n            }\n\n            let html = `<table class=\"w-full text-left text-sm\">\n                <thead class=\"border-b border-stone-200 text-stone-400 text-xs uppercase font-bold\">\n                    <tr>\n                        <th class=\"py-3 pr-4\">Item de Verificação<\u002Fth>\n                        <th class=\"py-3 pr-4\">Status<\u002Fth>\n                        <th class=\"py-3\">Histórico<\u002Fth>\n                    <\u002Ftr>\n                <\u002Fthead>\n                <tbody class=\"divide-y divide-stone-100\">`;\n\n            itens.forEach(item => {\n                const cor = corStatusChecklist(item.status);\n                html += `\n                    <tr>\n                        <td class=\"py-3.5 pr-4 text-stone-700\">${item.tipo || '—'}<\u002Ftd>\n                        <td class=\"py-3.5 pr-4\">\n                            <span class=\"inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full ${cor.badge}\">\n                                <span class=\"w-1.5 h-1.5 rounded-full ${cor.dot}\"><\u002Fspan>\n                                ${item.status || '—'}\n                            <\u002Fspan>\n                        <\u002Ftd>\n                        <td class=\"py-3.5 text-xs text-stone-400 text-right\">\n                            <div>Criado: ${fmtDataHora(item.dataCadastro)}<\u002Fdiv>\n                            ${item.dataAprovacao ? `<div class=\"text-blue-600 font-semibold\">${item.status}: ${fmtDataHora(item.dataAprovacao)}<\u002Fdiv>` : ''}\n                        <\u002Ftd>\n                    <\u002Ftr>\n                `;\n            });\n\n            html += `<\u002Ftbody><\u002Ftable>\n                <div class=\"text-right text-xs text-stone-400 mt-3\">Total de registros: ${itens.length}<\u002Fdiv>`;\n\n            corpo.innerHTML = html;\n        }\n\n        function fecharModalChecklist() {\n            document.getElementById('modalChecklist').classList.add('hidden');\n        }\n\n        async function abrirModalCancelamento(id) {\n            cancelamentoIdAtual = id;\n            document.getElementById('cancelPropostaId').textContent = id;\n            document.getElementById('descricaoCancelamento').value = '';\n            document.getElementById('outCancelamento').innerHTML = '';\n            document.getElementById('modalCancelamento').classList.remove('hidden');\n\n            const select = document.getElementById('selectMotivoCancelamento');\n            select.innerHTML = `<option value=\"\">Carregando motivos...<\u002Foption>`;\n\n            try {\n                const { ok, status, data } = await api('GET', '/operacoes/motivos-cancelamento');\n                if (status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n                if (!ok || !Array.isArray(data)) {\n                    select.innerHTML = `<option value=\"\">Falha ao carregar motivos<\u002Foption>`;\n                    return;\n                }\n                select.innerHTML = `<option value=\"\">Selecione um motivo...<\u002Foption>` +\n                    data.map(m => `<option value=\"${m.id}\">${m.name || m.nome || m.descricao || ('Motivo #' + m.id)}<\u002Foption>`).join('');\n            } catch (e) {\n                select.innerHTML = `<option value=\"\">Falha ao carregar motivos<\u002Foption>`;\n            }\n        }\n\n        function fecharModalCancelamento() {\n            document.getElementById('modalCancelamento').classList.add('hidden');\n            cancelamentoIdAtual = null;\n        }\n\n        async function confirmarCancelamento() {\n            const motivoId = document.getElementById('selectMotivoCancelamento').value;\n            const descricao = document.getElementById('descricaoCancelamento').value.trim();\n            const out = document.getElementById('outCancelamento');\n\n            if (!motivoId) { out.innerHTML = `<div class=\"text-sm text-red-600\">Selecione um motivo de cancelamento.<\u002Fdiv>`; return; }\n            if (!cancelamentoIdAtual) return;\n\n            const btn = document.getElementById('btnConfirmarCancelamento');\n            btn.disabled = true;\n            btn.textContent = 'Cancelando...';\n            out.innerHTML = '';\n\n            try {\n                const { ok, status, data } = await api('PUT', `/operacoes/${cancelamentoIdAtual}/cancelar/${motivoId}`, { descricao });\n\n                if (status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n\n                if (ok) {\n                    registrarAtuacao(cancelamentoIdAtual, 'cancelamento');\n                    fecharModalCancelamento();\n\n                    // Remove essa proposta da lista local antes de buscar a próxima,\n                    // para evitar que ela mesma seja escolhida de novo caso não estivesse marcada por ninguém.\n                    if (state.ultimoResultado?.result) {\n                        state.ultimoResultado.result = state.ultimoResultado.result.filter(p => String(p.id) !== String(cancelamentoIdAtual));\n                    }\n\n                    await concluirEIrParaProxima(); // a proposta cancelada some da fila; já busca a próxima\n                } else {\n                    out.innerHTML = `<div class=\"text-sm text-red-600\">Falha ao cancelar (HTTP ${status}): ${data?.message || 'erro desconhecido'}<\u002Fdiv>`;\n                }\n            } catch (e) {\n                if (e.message !== 'NETWORK_OR_CORS') out.innerHTML = `<div class=\"text-sm text-red-600\">Erro inesperado: ${e.message}<\u002Fdiv>`;\n            } finally {\n                btn.disabled = false;\n                btn.textContent = 'Confirmar cancelamento';\n            }\n        }\n\n        // ===================== ETAPAS DA PROPOSTA =====================\n        function fmtDataHora(iso) {\n            if (!iso) return '—';\n            const d = new Date(iso);\n            return d.toLocaleString('pt-BR');\n        }\n\n        async function abrirModalEtapas(id) {\n            document.getElementById('modalEtapas').classList.remove('hidden');\n            const corpo = document.getElementById('corpoModalEtapas');\n            corpo.innerHTML = `<div class=\"flex items-center justify-center gap-2 py-10 text-stone-400 text-sm\"><svg class=\"spin\" width=\"16\" height=\"16\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C215.19,49.64,232,87,232,128Z\"><\u002Fpath><\u002Fsvg>Carregando etapas...<\u002Fdiv>`;\n\n            try {\n                const { ok, status, data } = await api('GET', `/operacoes/etapas?IdProposta=${id}`);\n                if (status === 401) { alert('Sessão expirada. Faça login novamente.'); doLogout(); return; }\n                if (!ok || !data) {\n                    corpo.innerHTML = `<p class=\"text-sm text-red-600\">Falha ao carregar etapas (HTTP ${status}).<\u002Fp>`;\n                    return;\n                }\n\n                // A API pode retornar um único objeto de etapa ou uma lista — tratamos os dois casos\n                const etapas = Array.isArray(data) ? data : [data];\n                renderEtapas(etapas);\n            } catch (e) {\n                if (e.message !== 'NETWORK_OR_CORS') corpo.innerHTML = `<p class=\"text-sm text-red-600\">Erro inesperado: ${e.message}<\u002Fp>`;\n            }\n        }\n\n        // Resolve o nome legível de uma etapa, tentando várias fontes em ordem de confiança.\n        // O campo statusId desse endpoint não corresponde ao mapa de status pequeno (1-30) usado em outras telas —\n        // por isso não usamos mais \"Status #N\" como fallback (a pedido do usuário).\n        function nomeEtapa(etapa) {\n            if (etapa.status) return etapa.status;\n            if (STATUS_MAP[etapa.statusId]) return STATUS_MAP[etapa.statusId];\n            if (etapa.descricao) return etapa.descricao;\n            if (Array.isArray(etapa.historicoConsulta) && etapa.historicoConsulta.length > 0) {\n                const primeiro = etapa.historicoConsulta[0];\n                return primeiro.codigo || primeiro.descricao || 'Etapa';\n            }\n            return 'Etapa';\n        }\n\n        function renderEtapas(etapas) {\n            const corpo = document.getElementById('corpoModalEtapas');\n\n            let html = `<table class=\"w-full text-left text-sm mb-2\">\n                <thead class=\"border-b border-stone-200 text-stone-500 text-xs uppercase font-bold\">\n                    <tr><th class=\"py-2 pr-4\">Etapa<\u002Fth><th class=\"py-2\">Data<\u002Fth><\u002Ftr>\n                <\u002Fthead>\n                <tbody class=\"divide-y divide-stone-100\">`;\n\n            etapas.forEach((etapa, idx) => {\n                const temHistorico = Array.isArray(etapa.historicoConsulta) && etapa.historicoConsulta.length > 0;\n                html += `\n                    <tr class=\"${temHistorico ? 'cursor-pointer hover:bg-stone-50' : ''}\" ${temHistorico ? `onclick=\"toggleEtapaDetalhe(${idx})\"` : ''}>\n                        <td class=\"py-3 pr-4 font-semibold text-stone-800\">\n                            ${temHistorico ? `<svg id=\"chevEtapa-${idx}\" width=\"12\" height=\"12\" fill=\"currentColor\" viewBox=\"0 0 256 256\" class=\"inline mr-1.5 transition-transform text-stone-400\"><path d=\"M181.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L164.69,128,98.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,181.66,133.66Z\"><\u002Fpath><\u002Fsvg>` : ''}\n                            ${nomeEtapa(etapa)}\n                        <\u002Ftd>\n                        <td class=\"py-3 text-stone-500 code-font text-xs\">${fmtDataHora(etapa.dataStatus)}<\u002Ftd>\n                    <\u002Ftr>\n                    <tr id=\"detalheEtapa-${idx}\" class=\"hidden\">\n                        <td colspan=\"2\" class=\"pb-3 pl-6\">\n                            <div class=\"space-y-2.5 border-l-2 border-stone-200 pl-4\">\n                                ${temHistorico ? etapa.historicoConsulta.map(h => `\n                                    <div>\n                                        <p class=\"text-sm text-stone-700\">${h.descricao || h.codigo || '—'}<\u002Fp>\n                                        <p class=\"text-xs text-stone-400 code-font\">${fmtDataHora(h.dataCadastro)}<\u002Fp>\n                                    <\u002Fdiv>\n                                `).join('') : ''}\n                            <\u002Fdiv>\n                        <\u002Ftd>\n                    <\u002Ftr>\n                `;\n            });\n\n            html += `<\u002Ftbody><\u002Ftable>`;\n            corpo.innerHTML = html;\n        }\n\n        function toggleEtapaDetalhe(idx) {\n            const linha = document.getElementById(`detalheEtapa-${idx}`);\n            const chevron = document.getElementById(`chevEtapa-${idx}`);\n            if (!linha) return;\n            linha.classList.toggle('hidden');\n            if (chevron) chevron.style.transform = linha.classList.contains('hidden') ? '' : 'rotate(90deg)';\n        }\n\n        function fecharModalEtapas() {\n            document.getElementById('modalEtapas').classList.add('hidden');\n        }\n\n        // ===================== MODAL: PROPOSTA EM ANÁLISE =====================\n        function abrirModalEmAnalise(id, marcado) {\n            const nome = marcado.usuarioNome || '—';\n            const partes = nome.replace(/[^A-Za-zÀ-ú\\s]/g, ' ').trim().split(/\\s+/);\n            document.getElementById('emAnalisePropostaId').textContent = '#' + id;\n            document.getElementById('emAnaliseIniciais').textContent = ((partes[0] || '?')[0] + ((partes[1] || '')[0] || '')).toUpperCase();\n            document.getElementById('emAnaliseNome').textContent = nome;\n            document.getElementById('emAnaliseTempo').textContent = 'Em análise há ' + minutosDesde(marcado.dataInicio) + ' min';\n            document.getElementById('emAnaliseFila').textContent = marcado.fila || '—';\n            document.getElementById('modalEmAnalise').classList.remove('hidden');\n        }\n\n        function fecharModalEmAnalise() {\n            document.getElementById('modalEmAnalise').classList.add('hidden');\n        }\n\n        // Clique na linha: apenas abre a página de detalhe, sem marcar nada na planilha compartilhada\n        async function visualizarProposta(id, filaKey, p) {\n            if (!podeExecutarAcao()) return;\n\n            await carregarEmAnalise(); // garante o estado mais fresco possível antes de decidir\n\n            const marcado = state.emAnalise[String(id)];\n            const meuNome = state.usuario?.nome;\n\n            if (marcado && marcado.usuarioNome !== meuNome) {\n                abrirModalEmAnalise(id, marcado);\n                if (state.ultimoResultado) renderLista(state.ultimoResultado, state.filaAtiva, state.paginaPorFila[state.filaAtiva]);\n                return;\n            }\n\n            const template = BASE_URL_DETALHE;\n            window.open(template.replace('{id}', id), '_blank');\n\n            // Marca o colaborador logado nesta proposta (abre primeiro para ser rápido, marca em seguida)\n            const nomeFila = nomeFilaParaMarcacao(filaKey, p);\n            marcarEmAnalise(id, filaKey, nomeFila).then(() => {\n                if (state.ultimoResultado) renderLista(state.ultimoResultado, state.filaAtiva, state.paginaPorFila[state.filaAtiva]);\n            });\n        }\n\n        // \"Puxar\" uma proposta: abre a página de detalhe já (rápido) e marca como minha na planilha em seguida\n        async function puxarProposta(id, filaKey) {\n            const template = BASE_URL_DETALHE;\n            window.open(template.replace('{id}', id), '_blank');\n\n            await marcarEmAnalise(id, filaKey);\n            if (state.ultimoResultado) renderLista(state.ultimoResultado, state.filaAtiva, state.paginaPorFila[state.filaAtiva]);\n        }\n\n        // Busca, na fila ativa, a proposta sem ninguém marcado com maior tempo de espera, e já abre + marca\n        async function concluirEIrParaProxima() {\n            if (!podeExecutarAcao()) return;\n            setBotoesProximaDisabled(true);\n            try {\n                await carregarEmAnalise(); // garante estado fresco antes de decidir\n\n                const filaKey = state.filaAtiva;\n                const resultado = state.ultimoResultado;\n\n                if (!resultado || !resultado.result || resultado.result.length === 0) {\n                    alert('Não há propostas carregadas nesta fila. Clique em \"Aplicar filtros\" para atualizar.');\n                    return;\n                }\n\n                const livres = resultado.result.filter(p => !state.emAnalise[String(p.id)]);\n\n                if (livres.length === 0) {\n                    await liberarMinhaMarcacao();\n                    if (state.ultimoResultado) renderLista(state.ultimoResultado, state.filaAtiva, state.paginaPorFila[state.filaAtiva]);\n                    alert('Não há propostas livres (sem analista) nesta fila com os filtros atuais. Sua marcação anterior foi liberada.');\n                    return;\n                }\n\n                const ordenadas = [...livres].sort((a, b) => horasDesde(dataReferencia(b)) - horasDesde(dataReferencia(a)));\n                const proxima = ordenadas[0];\n\n                await puxarProposta(proxima.id, filaKey);\n            } finally {\n                setBotoesProximaDisabled(false);\n            }\n        }\n\n\n        function renderLista(data, filaKey, page) {\n            const result = data.result || [];\n            const contagemReal = data.rowCount ?? result.length;\n            document.getElementById('contagemLista').textContent = `${contagemReal} na fila`;\n\n            // Sincroniza o badge do menu de filas com esse mesmo número, evitando divergência\n            // entre a contagem exibida no menu e a contagem real da lista aberta.\n            if (state.modoBusca === null && FILAS[filaKey]) {\n                state.contagemPorFila[filaKey] = contagemReal;\n                renderProdutoNav();\n            }\n\n            const body = document.getElementById('listaBody');\n            body.innerHTML = '';\n\n            if (result.length === 0) {\n                body.innerHTML = `<p class=\"text-sm text-stone-400 text-center py-10\">Nenhuma proposta em Análise mesa com os filtros atuais<\u002Fp>`;\n                document.getElementById('paginacao').innerHTML = '';\n                return;\n            }\n\n            const ordenadas = [...result].sort((a, b) => horasDesde(dataReferencia(b)) - horasDesde(dataReferencia(a)));\n\n            ordenadas.forEach(p => {\n                const espera = horasDesde(dataReferencia(p));\n                const urg = corUrgencia(espera);\n                const marcado = state.emAnalise[String(p.id)];\n                const row = document.createElement('div');\n                row.className = 'row-proposta px-5 py-4';\n                row.onclick = () => visualizarProposta(p.id, filaKey, p);\n\n                const parcelamento = (p.quantidadeParcelas != null && p.valorParcela != null)\n                    ? `${p.quantidadeParcelas}x de ${fmtMoney(p.valorParcela)}`\n                    : '—';\n\n                row.innerHTML = `\n                    <div class=\"flex items-start justify-between gap-4\">\n                        <div class=\"flex-1 min-w-0\">\n                            <div class=\"flex items-center gap-2 flex-wrap mb-2\">\n                                <span class=\"text-xs font-bold px-2.5 py-1 rounded-full bg-[#E35205] text-white shadow-sm\">${p.produto?.name || '—'}<\u002Fspan>\n                                <span class=\"text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200\">${p.tipoCredito?.nome || p.tipoCredito?.name || '—'}<\u002Fspan>\n                                <span class=\"code-font text-xs text-stone-400\">#${p.id}<\u002Fspan>\n                            <\u002Fdiv>\n\n                            <p class=\"text-sm font-bold text-stone-800 mb-2\">${(p.tomador?.nome || '—').toUpperCase()}<\u002Fp>\n\n                            <div class=\"flex flex-wrap gap-x-5 gap-y-1.5 text-xs text-stone-600 mb-3\">\n                                <span><span class=\"text-stone-400\">Cpf:<\u002Fspan> <span class=\"code-font\">${p.tomador?.cpf || '—'}<\u002Fspan><\u002Fspan>\n                                <span><span class=\"text-stone-400\">Bruto (solicitado):<\u002Fspan> <span class=\"font-semibold code-font\">${fmtMoney(p.valorSolicitado)}<\u002Fspan><\u002Fspan>\n                                <span><span class=\"text-stone-400\">Liberado:<\u002Fspan> <span class=\"font-semibold code-font\">${fmtMoney(p.valorLiberado)}<\u002Fspan><\u002Fspan>\n                                <span><span class=\"text-stone-400\">Parcelamento:<\u002Fspan> <span class=\"font-semibold code-font\">${parcelamento}<\u002Fspan><\u002Fspan>\n                                <span><span class=\"text-stone-400\">Data da Proposta:<\u002Fspan> <span class=\"code-font\">${fmtDataHora(p.dataOperacao)}<\u002Fspan><\u002Fspan>\n                                <span><span class=\"text-stone-400\">Fundo Investimento:<\u002Fspan> ${p.tabela?.fundoInvestimento || '—'}<\u002Fspan>\n                                <span><span class=\"text-stone-400\">Parceiro:<\u002Fspan> ${p.tenant?.nome || '—'}<\u002Fspan>\n                            <\u002Fdiv>\n\n                            <div class=\"flex items-center gap-1.5 flex-wrap\">\n                                ${p.pendencia?.status?.name ? `<span class=\"text-[10px] font-semibold px-1.5 py-0.5 rounded bg-stone-100 text-stone-500\">${p.pendencia.status.name}<\u002Fspan>` : ''}\n                                ${marcado ? `<span class=\"text-[10px] font-semibold px-1.5 py-0.5 rounded bg-purple-50 text-purple-700 inline-flex items-center gap-1.5\" title=\"Marcado via planilha compartilhada\">🔒 em análise: ${marcado.usuarioNome} (${minu

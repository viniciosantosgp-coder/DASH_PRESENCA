Propagation();\n                    abrirModalPendencia(p.id);\n                });\n\n                row.querySelector(`#btnCompliance-${p.id}`).addEventListener('click', (ev) => {\n                    ev.stopPropagation(); // não deve abrir a proposta ao clicar nesse botão\n                    validarCompliance(p.id);\n                });\n\n                row.querySelector(`#btnCancelar-${p.id}`).addEventListener('click', (ev) => {\n                    ev.stopPropagation();\n                    abrirModalCancelamento(p.id);\n                });\n\n                const btnRemover = row.querySelector('.btn-remover-marcacao');\n                if (btnRemover) {\n                    btnRemover.addEventListener('click', (ev) => {\n                        ev.stopPropagation();\n                        removerMarcacaoAdmin(btnRemover.dataset.opId);\n                    });\n                }\n\n                body.appendChild(row);\n            });\n\n            const totalPag = data.pageCount || 1;\n            const pagAtual = page;\n            const pagDiv = document.getElementById('paginacao');\n            pagDiv.innerHTML = `\n                <span class=\"text-stone-400\">Página ${pagAtual} de ${totalPag} · ${data.rowCount ?? result.length} propostas<\u002Fspan>\n                <div class=\"flex gap-2\">\n                    <button ${pagAtual <= 1 ? 'disabled' : ''} onclick=\"mudarPagina(-1)\" class=\"px-3 py-1.5 border border-stone-200 rounded-lg text-xs font-semibold text-stone-600 disabled:opacity-40 hover:border-[#E35205] hover:text-[#E35205]\">Anterior<\u002Fbutton>\n                    <button ${pagAtual >= totalPag ? 'disabled' : ''} onclick=\"mudarPagina(1)\" class=\"px-3 py-1.5 border border-stone-200 rounded-lg text-xs font-semibold text-stone-600 disabled:opacity-40 hover:border-[#E35205] hover:text-[#E35205]\">Próxima<\u002Fbutton>\n                <\u002Fdiv>\n            `;\n        }\n\n        function mudarPagina(delta) {\n            const chave = chaveAtual();\n            state.paginaPorFila[chave] = (state.paginaPorFila[chave] || 1) + delta;\n            buscarPropostas();\n        }\n\n        // ===================== PAINEL: COLABORADORES POR FILA =====================\n        // ===================== DASHBOARD DE ATUAÇÃO (restrito) =====================\n        function abrirDashboardAtuacao() {\n            if (!podeEditarFiltros()) return;\n            document.getElementById('viewFila').classList.add('hidden');\n            document.getElementById('viewDashboardAtuacao').classList.remove('hidden');\n            carregarDashboardAtuacao();\n        }\n\n        function voltarParaFila() {\n            document.getElementById('viewDashboardAtuacao').classList.add('hidden');\n            document.getElementById('viewFila').classList.remove('hidden');\n        }\n\n        // Busca a aba \"Atuacoes\" da planilha compartilhada\n        async function carregarRegistrosAtuacao() {\n            const url = appsScriptUrl();\n            if (!url) return [];\n            try {\n                const res = await fetch(`${url}?aba=atuacoes`, { method: 'GET' });\n                const json = await res.json();\n                return json.ok ? json.data : [];\n            } catch (e) {\n                console.warn('Falha ao carregar atuações:', e.message);\n                return [];\n            }\n        }\n\n        function calcularEstatisticasAtuacao(registros) {\n            const porAnalista = {};\n\n            registros.forEach(r => {\n                const nome = r.usuarioNome || 'Desconhecido';\n                if (!porAnalista[nome]) {\n                    porAnalista[nome] = { compliance: 0, cancelamento: 0, pendencia: 0, duracoesMin: [] };\n                }\n                const item = porAnalista[nome];\n\n                if (r.tipoAcao === 'compliance') item.compliance++;\n                else if (r.tipoAcao === 'cancelamento') item.cancelamento++;\n                else if (r.tipoAcao === 'pendencia') item.pendencia++;\n\n                if (r.horaEntrada && r.horaConclusao) {\n                    const dur = (new Date(r.horaConclusao).getTime() - new Date(r.horaEntrada).getTime()) / 60000;\n                    if (dur >= 0 && isFinite(dur)) item.duracoesMin.push(dur);\n                }\n            });\n\n            return porAnalista;\n        }\n\n        function mediaMinutos(lista) {\n            if (!lista || lista.length === 0) return null;\n            const soma = lista.reduce((a, b) => a + b, 0);\n            return soma / lista.length;\n        }\n\n        function fmtMinutos(min) {\n            if (min == null) return '—';\n            if (min < 60) return `${min.toFixed(1)} min`;\n            const h = Math.floor(min / 60);\n            const m = Math.round(min % 60);\n            return `${h}h ${m}min`;\n        }\n\n        async function carregarDashboardAtuacao() {\n            const corpo = document.getElementById('corpoDashboardAtuacao');\n            corpo.innerHTML = `<div class=\"flex items-center gap-2 text-stone-400\"><svg class=\"spin\" width=\"14\" height=\"14\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C215.19,49.64,232,87,232,128Z\"><\u002Fpath><\u002Fsvg>Carregando atuações...<\u002Fdiv>`;\n\n            const registros = await carregarRegistrosAtuacao();\n\n            if (registros.length === 0) {\n                corpo.innerHTML = `<p class=\"text-stone-400\">Nenhuma atuação registrada ainda.<\u002Fp>`;\n                return;\n            }\n\n            const porAnalista = calcularEstatisticasAtuacao(registros);\n            const nomes = Object.keys(porAnalista).sort();\n\n            // Totais gerais (soma de todos os analistas)\n            const geral = { compliance: 0, cancelamento: 0, pendencia: 0, duracoesMin: [] };\n            nomes.forEach(nome => {\n                const item = porAnalista[nome];\n                geral.compliance += item.compliance;\n                geral.cancelamento += item.cancelamento;\n                geral.pendencia += item.pendencia;\n                geral.duracoesMin = geral.duracoesMin.concat(item.duracoesMin);\n            });\n\n            function linhaTabela(nome, item, destaque) {\n                const total = item.compliance + item.cancelamento + item.pendencia;\n                const media = mediaMinutos(item.duracoesMin);\n                return `\n                    <tr class=\"${destaque ? 'bg-orange-50 font-bold' : ''}\">\n                        <td class=\"py-3 px-4 ${destaque ? 'text-[#E35205]' : 'text-stone-700 font-semibold'}\">${nome}<\u002Ftd>\n                        <td class=\"py-3 px-4 text-center code-font text-green-700\">${item.compliance}<\u002Ftd>\n                        <td class=\"py-3 px-4 text-center code-font text-red-600\">${item.cancelamento}<\u002Ftd>\n                        <td class=\"py-3 px-4 text-center code-font text-amber-600\">${item.pendencia}<\u002Ftd>\n                        <td class=\"py-3 px-4 text-center code-font text-stone-600\">${fmtMinutos(media)}<\u002Ftd>\n                        <td class=\"py-3 px-4 text-center code-font font-bold text-stone-800\">${total}<\u002Ftd>\n                    <\u002Ftr>\n                `;\n            }\n\n            let html = `\n                <div class=\"bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden\">\n                    <table class=\"w-full text-left text-sm\">\n                        <thead class=\"bg-stone-50 border-b border-stone-200 text-stone-500 text-xs uppercase font-bold\">\n                            <tr>\n                                <th class=\"py-3 px-4\">Analista<\u002Fth>\n                                <th class=\"py-3 px-4 text-center\">Compliance validado<\u002Fth>\n                                <th class=\"py-3 px-4 text-center\">Cancelamentos<\u002Fth>\n                                <th class=\"py-3 px-4 text-center\">Pendências<\u002Fth>\n                                <th class=\"py-3 px-4 text-center\">Tempo médio<\u002Fth>\n                                <th class=\"py-3 px-4 text-center\">Total propostas<\u002Fth>\n                            <\u002Ftr>\n                        <\u002Fthead>\n                        <tbody class=\"divide-y divide-stone-100\">\n                            ${linhaTabela('GERAL (todos os analistas)', geral, true)}\n                            ${nomes.map(nome => linhaTabela(nome, porAnalista[nome], false)).join('')}\n                        <\u002Ftbody>\n                    <\u002Ftable>\n                <\u002Fdiv>\n                <p class=\"text-xs text-stone-400 mt-3\">Tempo médio calculado como diferença entre a hora em que a proposta foi marcada \"em análise\" e a hora da conclusão (compliance, pendência ou cancelamento). Baseado em ${registros.length} registro(s) na planilha.<\u002Fp>\n            `;\n\n            corpo.innerHTML = html;\n        }\n\n        async function carregarColaboradoresPorFila() {\n            const out = document.getElementById('colabResultado');\n            out.innerHTML = `<div class=\"flex items-center gap-2 text-stone-400\"><svg class=\"spin\" width=\"14\" height=\"14\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C215.19,49.64,232,87,232,128Z\"><\u002Fpath><\u002Fsvg>Atualizando planilha de Em Análise...<\u002Fdiv>`;\n\n            await carregarEmAnalise();\n            const entradas = Object.values(state.emAnalise);\n\n            if (entradas.length === 0) {\n                out.innerHTML = `<p class=\"text-stone-400\">Nenhum colaborador está com uma proposta marcada como \"em análise\" agora.<\u002Fp>`;\n                return;\n            }\n\n            entradas.sort((a, b) => a.usuarioNome.localeCompare(b.usuarioNome));\n\n            const autorizado = podeEditarFiltros();\n\n            let html = `<div class=\"space-y-3\">`;\n            entradas.forEach(item => {\n                html += `\n                    <div class=\"border border-stone-200 rounded-xl p-3\">\n                        <p class=\"font-semibold text-stone-700 text-sm\">${item.usuarioNome}<\u002Fp>\n                        <div class=\"flex items-center gap-1.5 mt-1.5 flex-wrap\">\n                            <span class=\"text-xs font-semibold px-2 py-0.5 rounded-full bg-orange-50 text-[#E35205] border border-orange-200\">${item.fila}<\u002Fspan>\n                            <span class=\"code-font text-xs text-stone-500\">#${item.operacaoId}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"flex items-center justify-between mt-1.5\">\n                            <span class=\"text-xs text-stone-400\">${minutosDesde(item.dataInicio)} min<\u002Fspan>\n                            ${autorizado ? `<button class=\"btn-remover-colab text-xs font-semibold text-red-500 hover:text-red-700\" data-op-id=\"${item.operacaoId}\">Remover<\u002Fbutton>` : ''}\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                `;\n            });\n            html += `<\u002Fdiv>`;\n            html += `<p class=\"text-xs text-stone-400 mt-3\">Baseado em quem marcou a proposta como \"em análise\" na planilha compartilhada — não é o responsável histórico da operação.<\u002Fp>`;\n\n            out.innerHTML = html;\n\n            if (autorizado) {\n                out.querySelectorAll('.btn-remover-colab').forEach(btn => {\n                    btn.addEventListener('click', () => removerMarcacaoAdmin(btn.dataset.opId).then(carregarColaboradoresPorFila));\n                });\n            }\n        }\n\n        // ===================== INIT =====================\n        window.onload = () => {\n            if (tentarAutoLogin()) entrarNoApp();\n        };\n\n        document.addEventListener('keydown', (ev) => {\n            if (ev.key !== 'Escape') return;\n            const el = document.getElementById('modalEmAnalise');\n            if (el && !el.classList.contains('hidden')) fecharModalEmAnalise();\n        });\n\n        // Fecha os dropdowns de filtro (Pendências / Tipo de Crédito) ao clicar fora deles\n        document.addEventListener('click', (ev) => {\n            ['detPendencias', 'detTipoCredito'].forEach(id => {\n                const det = document.getElementById(id);\n                if (det && det.open && !det.contains(ev.target)) {\n                    det.open = false;\n                }\n            });\n        });\n    <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>

                                <svg width=\"17\" height=\"17\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,1,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z\"><\u002Fpath><\u002Fsvg>\n                                <\u002Fbutton>\n                                <svg width=\"16\" height=\"16\" fill=\"currentColor\" viewBox=\"0 0 256 256\" class=\"text-stone-300 shrink-0 ml-1\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"><\u002Fpath><\u002Fsvg>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                `;\n\n                row.querySelector(`#btnChecklist-${p.id}`).addEventListener('click', (ev) => {\n                    ev.stopPropagation();\n                    abrirModalChecklist(p.id);\n                });\n\n                row.querySelector(`#btnPendenciar-${p.id}`).addEventListener('click', (ev) => {\n                    ev.stopPropagation();\n                    abrirModalPendencia(p.id);\n                });\n\n                row.querySelector(`#btnCompliance-${p.id}`).addEventListener('click', (ev) => {\n                    ev.stopPropagation(); // não deve abrir a proposta ao clicar nesse botão\n                    validarCompliance(p.id);\n                });\n\n                row.querySelector(`#btnCancelar-${p.id}`).addEventListener('click', (ev) => {\n                    ev.stopPropagation();\n                    abrirModalCancelamento(p.id);\n                });\n\n                const btnRemover = row.querySelector('.btn-remover-marcacao');\n                if (btnRemover) {\n                    btnRemover.addEventListener('click', (ev) => {\n                        ev.stopPropagation();\n                        removerMarcacaoAdmin(btnRemover.dataset.opId);\n                    });\n                }\n\n                body.appendChild(row);\n            });\n\n            const totalPag = data.pageCount || 1;\n            const pagAtual = page;\n            const pagDiv = document.getElementById('paginacao');\n            pagDiv.innerHTML = `\n                <span class=\"text-stone-400\">Página ${pagAtual} de ${totalPag} · ${data.rowCount ?? result.length} propostas<\u002Fspan>\n                <div class=\"flex gap-2\">\n                    <button ${pagAtual <= 1 ? 'disabled' : ''} onclick=\"mudarPagina(-1)\" class=\"px-3 py-1.5 border border-stone-200 rounded-lg text-xs font-semibold text-stone-600 disabled:opacity-40 hover:border-[#E35205] hover:text-[#E35205]\">Anterior<\u002Fbutton>\n                    <button ${pagAtual >= totalPag ? 'disabled' : ''} onclick=\"mudarPagina(1)\" class=\"px-3 py-1.5 border border-stone-200 rounded-lg text-xs font-semibold text-stone-600 disabled:opacity-40 hover:border-[#E35205] hover:text-[#E35205]\">Próxima<\u002Fbutton>\n                <\u002Fdiv>\n            `;\n        }\n\n        function mudarPagina(delta) {\n            const chave = chaveAtual();\n            state.paginaPorFila[chave] = (state.paginaPorFila[chave] || 1) + delta;\n            buscarPropostas();\n        }\n\n        // ===================== PAINEL: COLABORADORES POR FILA =====================\n        function abrirDrawerColaboradores() {\n            if (!podeEditarFiltros()) return;\n            document.getElementById('drawerColaboradores').classList.remove('-translate-x-full');\n            document.getElementById('drawerBackdrop').classList.remove('hidden');\n            carregarColaboradoresPorFila();\n        }\n\n        function fecharDrawerColaboradores() {\n            document.getElementById('drawerColaboradores').classList.add('-translate-x-full');\n            document.getElementById('drawerBackdrop').classList.add('hidden');\n        }\n\n        async function carregarColaboradoresPorFila() {\n            const out = document.getElementById('colabResultado');\n            out.innerHTML = `<div class=\"flex items-center gap-2 text-stone-400\"><svg class=\"spin\" width=\"14\" height=\"14\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C215.19,49.64,232,87,232,128Z\"><\u002Fpath><\u002Fsvg>Atualizando planilha de Em Análise...<\u002Fdiv>`;\n\n            await carregarEmAnalise();\n            const entradas = Object.values(state.emAnalise);\n\n            if (entradas.length === 0) {\n                out.innerHTML = `<p class=\"text-stone-400\">Nenhum colaborador está com uma proposta marcada como \"em análise\" agora.<\u002Fp>`;\n                return;\n            }\n\n            entradas.sort((a, b) => a.usuarioNome.localeCompare(b.usuarioNome));\n\n            const autorizado = podeEditarFiltros();\n\n            let html = `<div class=\"space-y-3\">`;\n            entradas.forEach(item => {\n                html += `\n                    <div class=\"border border-stone-200 rounded-xl p-3\">\n                        <p class=\"font-semibold text-stone-700 text-sm\">${item.usuarioNome}<\u002Fp>\n                        <div class=\"flex items-center gap-1.5 mt-1.5 flex-wrap\">\n                            <span class=\"text-xs font-semibold px-2 py-0.5 rounded-full bg-orange-50 text-[#E35205] border border-orange-200\">${item.fila}<\u002Fspan>\n                            <span class=\"code-font text-xs text-stone-500\">#${item.operacaoId}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"flex items-center justify-between mt-1.5\">\n                            <span class=\"text-xs text-stone-400\">${minutosDesde(item.dataInicio)} min<\u002Fspan>\n                            ${autorizado ? `<button class=\"btn-remover-colab text-xs font-semibold text-red-500 hover:text-red-700\" data-op-id=\"${item.operacaoId}\">Remover<\u002Fbutton>` : ''}\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                `;\n            });\n            html += `<\u002Fdiv>`;\n            html += `<p class=\"text-xs text-stone-400 mt-3\">Baseado em quem marcou a proposta como \"em análise\" na planilha compartilhada — não é o responsável histórico da operação.<\u002Fp>`;\n\n            out.innerHTML = html;\n\n            if (autorizado) {\n                out.querySelectorAll('.btn-remover-colab').forEach(btn => {\n                    btn.addEventListener('click', () => removerMarcacaoAdmin(btn.dataset.opId).then(carregarColaboradoresPorFila));\n                });\n            }\n        }\n\n        // ===================== INIT =====================\n        window.onload = () => {\n            if (tentarAutoLogin()) entrarNoApp();\n        };\n\n        document.addEventListener('keydown', (ev) => {\n            if (ev.key !== 'Escape') return;\n            const mp = document.getElementById('modalPendencia');\n            const mc = document.getElementById('modalCancelamento');\n            if (mp && !mp.classList.contains('hidden')) fecharModalPendencia();\n            if (mc && !mc.classList.contains('hidden')) fecharModalCancelamento();\n        });\n\n        // Fecha os dropdowns de filtro (Pendências / Tipo de Crédito) ao clicar fora deles\n        document.addEventListener('click', (ev) => {\n            ['detPendencias', 'detTipoCredito'].forEach(id => {\n                const det = document.getElementById(id);\n                if (det && det.open && !det.contains(ev.target)) {\n                    det.open = false;\n                }\n            });\n        });\n    <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
